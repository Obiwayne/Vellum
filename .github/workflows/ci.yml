name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # --ignore-scripts: skip Electron's binary download, nothing here launches the app
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
