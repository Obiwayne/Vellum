name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to a pull request supersedes its older run. Every master push gets its own group, so runs
# neither cancel nor replace each other (a shared group would drop all but the newest queued run).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # --ignore-scripts: skip Electron's binary download, nothing here launches the app
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp

  # Opens the real app on the runner's interactive desktop and runs the MCP suites against it.
  mcp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # Electron has no postinstall: test:mcp downloads its binary itself (node_modules/electron/install.js)
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npm run test:mcp

  # Builds the installer and runs it silently in temp folders: per-user install, shortcuts, uninstall entry, closing a
  # running Vellum, uninstall keeping the data folder (scripts/test-installer.ps1).
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist
      - run: npm run test:installer
