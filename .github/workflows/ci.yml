name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to a pull request supersedes its older run. Every master push gets its own group, so runs
# neither cancel nor replace each other (a shared group would drop all but the newest queued run).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # --ignore-scripts: skip Electron's binary download, nothing here launches the app
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # the MCP bundle tests (src/main/mcp-bundle.test.ts) need mcp's dependencies and fail without them in CI
      - run: npm ci
        working-directory: mcp
      - run: npm test
      - run: npm run build
        working-directory: mcp

  # Opens the real app on the runner's interactive desktop and runs the MCP suites against it.
  mcp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # Electron has no postinstall: test:mcp downloads its binary itself (node_modules/electron/install.js)
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npm run test:mcp

  # Packs the app (npm run pack) and checks the packed result: what is inside app.asar (electron-updater, or the installed
  # build's update check is broken), and the packaged-app smoke test, which opens it and checks the update engine runs.
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      # Electron has no postinstall here: fetch its binary (electron-builder copies it into the package)
      - run: node node_modules/electron/install.js
      - run: npm run pack
      - run: npx vitest run src/main/packaging.test.ts
        env:
          VELLUM_REQUIRE_PACK: '1'
      - run: node scripts/smoke-packaged.mjs

  # Builds a test installer (own appId and product name) and runs it silently in temp folders: per-user install, shortcuts, uninstall entry, closing a
  # running Vellum, uninstall keeping the data folder (scripts/test-installer.ps1).
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # the installer carries the MCP bundle (npm run build:mcp), which needs mcp's packages
      - run: npm ci
        working-directory: mcp
      - run: npm run test:installer

  # An installed old version updates itself to the next one from a local feed (scripts/test-update.mjs): states over IPC, silent
  # install, relaunch, data untouched. Uses the test product only.
  update:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: node node_modules/electron/install.js
      - run: npm run test:update

