# Packages Vellum for Windows: `npm run pack` (unpacked app in release/win-unpacked) and `npm run dist` (installer).
# The input is the electron-vite build in out/ (package.json "main" points at out/main/index.js).
appId: com.vellum.app
productName: Vellum
copyright: Vellum
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# The MCP server bundle (npm run build:mcp -> resources-out/mcp/index.mjs, one file with the SDK, zod and ws inlined) is copied
# next to the app OUTSIDE the asar, so any process can run it: ELECTRON_RUN_AS_NODE=1 Vellum.exe resources/mcp/index.mjs
extraResources:
  - from: resources-out/mcp
    to: mcp
# use the Electron binary npm already installed instead of downloading a second copy
# (this copies Electron's resources/default_app.asar, 110 KB, next to our app.asar. Decision: keep it. Electron only runs
# default_app.asar when there is no app.asar, and packaging.test.ts asserts app.asar is there)
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
  artifactName: Vellum-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false

# the feed electron-updater reads in installed builds (latest.yml + installer + blockmap on GitHub Releases); nothing is published by `npm run dist`
publish:
  provider: github
  owner: Obiwayne
  repo: Vellum
