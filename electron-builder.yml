# Packages Vellum for Windows: `npm run pack` (unpacked app in release/win-unpacked) and `npm run dist` (installer).
# The input is the electron-vite build in out/ (package.json "main" points at out/main/index.js).
appId: com.vellum.app
productName: Vellum
copyright: Vellum
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# use the Electron binary npm already installed instead of downloading a second copy
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
  artifactName: Vellum-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
